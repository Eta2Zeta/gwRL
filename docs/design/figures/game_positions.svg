<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-labelledby="title desc">
  <title id="title">A game is a chain of positions</title>
  <desc id="desc">A row of five positions joined by arrows: a decision, where one alliance chooses one legal move; a move leads to the next decision, often by the same alliance; a move leads to a chance event, where the engine rolls dice, say for a battle; the dice lead to further decisions, over a thousand of them; the chain ends after round 11 with the final scores. Below: one real game, played on 5 November with the networks after one update (seed 1105), had 1,349 decisions and 183 chance events; its 612th decision is the running example, in round 5 the Comintern choosing the CCP's Combat Movement from 5 legal moves; it ended Axis +49.0, Allies −63.8, Comintern −106.2.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 15px; font-weight: 600; }
      .head { font-size: 14px; font-weight: 600; }
      .sub { font-size: 12px; fill: #57606a; font-style: italic; }
      .body { font-size: 13px; }
      .bold { font-weight: 600; }
      .label { font-size: 12px; fill: #57606a; }
      .small { font-size: 11px; fill: #57606a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
      .num { font-size: 12px; font-weight: 600; }
      .zero { font-size: 12px; fill: #8c959f; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="269" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text class="title" x="24" y="36">A game is a chain of positions</text>
  <rect x="24" y="56" width="144" height="92" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="head" x="38" y="82">Decision</text>
  <text class="label" x="38" y="106">one alliance chooses</text>
  <text class="label" x="38" y="124">one legal move</text>
  <line x1="172" y1="102" x2="212" y2="102" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="192" y="92" text-anchor="middle">a move</text>
  <rect x="216" y="56" width="144" height="92" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="head" x="230" y="82">Decision</text>
  <text class="label" x="230" y="106">the next choice, often</text>
  <text class="label" x="230" y="124">by the same alliance</text>
  <line x1="364" y1="102" x2="404" y2="102" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="384" y="92" text-anchor="middle">a move</text>
  <rect x="408" y="56" width="144" height="92" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="head" x="422" y="82">Chance event</text>
  <text class="label" x="422" y="106">the engine rolls dice,</text>
  <text class="label" x="422" y="124">say for a battle</text>
  <line x1="556" y1="102" x2="596" y2="102" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="576" y="92" text-anchor="middle">the dice</text>
  <rect x="600" y="56" width="144" height="92" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="head" x="614" y="82">Decision</text>
  <text class="label" x="614" y="106">and so on, over a</text>
  <text class="label" x="614" y="124">thousand decisions</text>
  <line x1="748" y1="102" x2="788" y2="102" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="768" y="92" text-anchor="middle">…</text>
  <rect x="792" y="56" width="144" height="92" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
  <text class="head" x="806" y="82">End</text>
  <text class="label" x="806" y="106">after round 11:</text>
  <text class="label" x="806" y="124">the final scores</text>
  <rect x="24" y="168" width="912" height="84" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="body bold" x="40" y="192">One real game, played on 5 November with the networks after one update (seed 1105)</text>
  <text class="body" x="40" y="214">1,349 decisions and 183 chance events. Its 612th decision is this document's running example: in round 5,</text>
  <text class="body" x="40" y="234">the Comintern chooses the CCP's Combat Movement from 5 legal moves. The game ended Axis +49.0, Allies −63.8, Comintern −106.2.</text>
</svg>
