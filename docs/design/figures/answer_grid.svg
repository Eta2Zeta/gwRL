<svg xmlns="http://www.w3.org/2000/svg" width="960" height="662" viewBox="0 0 960 662" role="img" aria-labelledby="title desc">
  <title id="title">The board and the position as grids of answers</title>
  <desc id="desc">Two grids of real answers from decision 612. The board: one line per zone, one column per zone question; shown are Shensi, Hopeh, Suiyuan, Szechwan and Tsinghai, and 8 of the 42,737 columns: possessor:ccp, possessor:kmt, units:ccp:militia, units:ccp:mountain_infantry, units:kmt:militia, units:kmt:infantry, rail_to:land_china_hopeh and project:kmt:fortification. Shensi answers 1 to possessor:ccp, units:ccp:militia, units:ccp:mountain_infantry and rail_to:land_china_hopeh; Hopeh 1 to possessor:kmt and project:kmt:fortification; Suiyuan 1 to possessor:kmt and 3 to units:kmt:militia; Szechwan 1 to possessor:kmt; Tsinghai 1 to possessor:kmt, 1 to units:kmt:militia and 2 to units:kmt:infantry; every other cell shown is 0. In all, Shensi has 9 non-zero answers, Hopeh 28, Suiyuan 12, Szechwan 2 and Tsinghai 13, and the 37 zones 840. The position: one line of 6,637 questions, with round 5, completed_rounds 4, rounds_left 7, phase:combat_movement 1, turn_nation:ccp 1, turn_nation:japan 0 and phase:noncombat_movement 0; 191 non-zero answers in all.</desc>
