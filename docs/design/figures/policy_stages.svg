      .head { font-size: 14px; font-weight: 600; }
      .sub { font-size: 12px; fill: #57606a; font-style: italic; }
      .body { font-size: 13px; }
      .bold { font-weight: 600; }
      .label { font-size: 12px; fill: #57606a; }
      .small { font-size: 11px; fill: #57606a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
      .num { font-size: 12px; font-weight: 600; }
      .zero { font-size: 12px; fill: #8c959f; }
    </style>
  </defs>
