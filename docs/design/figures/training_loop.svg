<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">The training loop</title>
  <desc id="desc">Three steps in a cycle. One: play a batch of self-play games with frozen networks; at every decision the alliance to move searches, asking its network many times, and a random five percent of decisions are kept as samples. When a game ends, its final scores are added to its samples. Two: the samples join a replay buffer of recent samples. Three: training steps update the three networks, one per alliance. Four: the updated networks are saved and play the next batch.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 15px; font-weight: 600; }
      .sub { font-size: 12px; fill: #57606a; font-style: italic; }
      .body { font-size: 13px; }
      .label { font-size: 12px; fill: #57606a; }
      .step { font-size: 13px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="329" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- 1. Self-play -->
  <rect x="24" y="30" width="236" height="190" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
  <circle cx="48" cy="56" r="13" fill="#0969da"/>
  <text class="step" x="48" y="60.5" text-anchor="middle">1</text>
  <text class="title" x="70" y="61">Play a batch of games</text>
  <text class="sub" x="40" y="86">networks frozen</text>
  <text class="body" x="40" y="112">At every decision, the alliance</text>
  <text class="body" x="40" y="130">to move searches: it asks its</text>
  <text class="body" x="40" y="148">network many times, then</text>
  <text class="body" x="40" y="166">picks a move.</text>
  <text class="body" x="40" y="190">A random 5% of decisions are</text>
  <text class="body" x="40" y="208">kept as samples (Mac profile).</text>

  <!-- 2. Replay buffer -->
  <rect x="360" y="30" width="236" height="190" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
  <circle cx="384" cy="56" r="13" fill="#1a7f37"/>
  <text class="step" x="384" y="60.5" text-anchor="middle">2</text>
  <text class="title" x="406" y="61">Replay buffer</text>
  <text class="sub" x="376" y="86">the most recent samples</text>
  <text class="body" x="376" y="112">A sample holds the position,</text>
  <text class="body" x="376" y="130">the moves the search</text>
  <text class="body" x="376" y="148">preferred and, once the game</text>
  <text class="body" x="376" y="166">is over, how it ended.</text>

  <!-- 3. Training -->
  <rect x="696" y="30" width="236" height="190" rx="10" fill="#fbefff" stroke="#c297ff"/>
  <circle cx="720" cy="56" r="13" fill="#8250df"/>
  <text class="step" x="720" y="60.5" text-anchor="middle">3</text>
  <text class="title" x="742" y="61">Train three networks</text>
  <text class="sub" x="712" y="86">one per alliance</text>
  <text class="body" x="712" y="112">Each learns to predict the</text>
  <text class="body" x="712" y="130">search's preferences and</text>
  <text class="body" x="712" y="148">the final scores better.</text>

  <!-- Arrows between steps -->
  <line x1="264" y1="125" x2="355" y2="125" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="label" x="309" y="100" text-anchor="middle">game over:</text>
  <text class="label" x="309" y="115" text-anchor="middle">scores added</text>
  <line x1="600" y1="125" x2="691" y2="125" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="label" x="645" y="100" text-anchor="middle">training</text>
  <text class="label" x="645" y="115" text-anchor="middle">steps</text>

  <!-- Return arrow -->
  <path d="M 814 222 L 814 268 Q 814 284 798 284 L 158 284 Q 142 284 142 268 L 142 226" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="283" y="268" width="390" height="32" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="302" cy="284" r="12" fill="#57606a"/>
  <text class="step" x="302" y="288.5" text-anchor="middle">4</text>
  <text class="body" x="322" y="288.5" font-weight="600">Save the networks: the next batch plays with them</text>
</svg>
