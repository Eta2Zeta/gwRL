  <polyline points="150.0,224.5 285.0,224.5 420.0,224.5 555.0,224.5 690.0,224.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="150.0" cy="224.5" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="285.0" cy="224.5" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="420.0" cy="224.5" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="555.0" cy="224.5" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="690.0" cy="224.5" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
  <text class="end" x="704" y="228.5">cores: about 5,400</text>
  <text class="end" x="704" y="295.6">GPU: 1,640</text>
  <text class="end" x="704" y="441.4">one CPU core: 125</text>
  <text class="label" x="264.3" y="248.0" text-anchor="middle">the cores limit</text>
  <text class="label" x="555.0" y="292.0" text-anchor="middle">the GPU limits</text>
</svg>
