  <polyline points="150.0,190.2 285.0,202.1 420.0,234.4 555.0,265.2 690.0,291.6" fill="none" stroke="#eb6834" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="150.0" cy="190.2" r="4" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
  <circle cx="285.0" cy="202.1" r="4" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
