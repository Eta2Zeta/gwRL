<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">What a network computes for one decision</title>
  <desc id="desc">For decision 612 at width 64: the 37 zone feature vectors, one per zone, with 840 non-zero feature values in all, go through the zone embedding table of 35,329 embeddings, the embedding layer, each on its own, to 37 zone vectors; the global feature vector, with 131 non-zero feature values, through the global embedding table of 2,766 embeddings to one global vector; the 5 action feature vectors, with 80 non-zero feature values in all, through the action embedding table of 11,046 embeddings to 5 action vectors, one per legal action. Two message-passing layers update every zone vector from its neighbours along the 160 directed borders and from the global vector, and the global vector from the average zone. A linear layer turns the global vector and the zones' mean and maximum into a summary vector, and the value head turns that into three values, one per alliance. Each action vector is joined with the vectors of its source zone, its target zone and its path zones; with the summary vector, the policy head turns it into the action's logit, giving 5 logits and 5 probabilities, built by a hierarchical softmax.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .col { font-size: 12px; fill: #57606a; font-weight: 600; letter-spacing: 0.02em; }
      .name { font-size: 14px; font-weight: 600; }
      .body { font-size: 13px; }
      .small { font-size: 12px; fill: #57606a; }
      .label { font-size: 12px; fill: #57606a; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="479" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Column headers -->
  <text class="col" x="24" y="38">THE INPUT</text>
  <text class="col" x="262" y="38">EMBEDDING LAYERS</text>
  <text class="col" x="500" y="38">VECTORS OF 64 NUMBERS</text>
  <text class="col" x="724" y="38">THEN</text>

  <!-- Row 1: board -->
  <rect x="24" y="52" width="190" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="name" x="38" y="76">Zone features</text>
  <text class="small" x="38" y="98">37 zones, 840 non-zero values</text>
  <rect x="262" y="52" width="190" height="60" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="name" x="276" y="76">Zone embedding table</text>
  <text class="small" x="276" y="98">35,329 embeddings</text>
  <rect x="500" y="52" width="180" height="60" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="name" x="514" y="87">37 zone vectors</text>

  <!-- Row 2: position -->
  <rect x="24" y="136" width="190" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="name" x="38" y="160">Global features</text>
  <text class="small" x="38" y="182">1 row, 131 non-zero values</text>
  <rect x="262" y="136" width="190" height="60" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="name" x="276" y="160">Global embedding table</text>
  <text class="small" x="276" y="182">2,766 embeddings</text>
  <rect x="500" y="136" width="180" height="60" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="name" x="514" y="171">1 global vector</text>

  <!-- Row 3: moves -->
  <rect x="24" y="220" width="190" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="name" x="38" y="244">Action features</text>
  <text class="small" x="38" y="266">5 actions, 80 non-zero values</text>
  <rect x="262" y="220" width="190" height="60" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="name" x="276" y="244">Action embedding table</text>
  <text class="small" x="276" y="266">11,046 embeddings</text>
  <rect x="500" y="220" width="180" height="60" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="name" x="514" y="255">5 action vectors</text>

  <!-- Row arrows -->
  <line x1="216" y1="82" x2="258" y2="82" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="454" y1="82" x2="496" y2="82" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="216" y1="166" x2="258" y2="166" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="454" y1="166" x2="496" y2="166" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="216" y1="250" x2="258" y2="250" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="454" y1="250" x2="496" y2="250" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Message layers -->
  <rect x="724" y="52" width="212" height="152" rx="8" fill="#fbefff" stroke="#c297ff"/>
  <text class="name" x="738" y="76">2 message-passing layers</text>
  <text class="body" x="738" y="98">Each zone vector is updated</text>
  <text class="body" x="738" y="115">from its neighbours' vectors</text>
  <text class="body" x="738" y="132">along the 160 directed</text>
  <text class="body" x="738" y="149">borders, and from the</text>
  <text class="body" x="738" y="166">global vector; the global</text>
  <text class="body" x="738" y="183">vector from the average zone.</text>
  <line x1="682" y1="82" x2="720" y2="96" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="682" y1="166" x2="720" y2="156" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Value head -->
  <rect x="724" y="324" width="212" height="128" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
  <text class="name" x="738" y="348">Value</text>
  <text class="body" x="738" y="370">global vector + the zones'</text>
  <text class="body" x="738" y="387">mean and maximum → a</text>
  <text class="body" x="738" y="404">summary vector → 3 values,</text>
  <text class="body" x="738" y="421">one per alliance</text>
  <line x1="830" y1="206" x2="830" y2="320" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="label" x="838" y="268">updated vectors</text>

  <!-- Policy head -->
  <rect x="262" y="324" width="400" height="128" rx="8" fill="#fff1e5" stroke="#fb8f44"/>
  <text class="name" x="276" y="348">Policy</text>
  <text class="body" x="276" y="370">each action vector + the vectors of its source zone,</text>
  <text class="body" x="276" y="387">target zone and path zones + the summary vector</text>
  <text class="body" x="276" y="404">→ 5 logits → 5 probabilities, by a hierarchical softmax:</text>
  <text class="body" x="276" y="421">kind, what acts, how it travels, what it acts on, action</text>
  <line x1="590" y1="282" x2="590" y2="320" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="746" y1="206" x2="654" y2="320" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="label" x="712" y="292">zone vectors</text>
  <line x1="722" y1="420" x2="666" y2="420" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="label" x="693" y="410" text-anchor="middle">summary</text>
</svg>
