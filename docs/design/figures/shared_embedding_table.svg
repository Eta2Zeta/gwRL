      <line x1="2.75" y1="0" x2="2.75" y2="12" stroke="#9fd5fb" stroke-width="0.5"/>
    </pattern>
    <pattern id="embcells" width="26" height="2.5" patternUnits="userSpaceOnUse">
      <rect width="26" height="2.5" fill="#fff8c5"/>
      <line x1="0" y1="2.4" x2="26" y2="2.4" stroke="#e9d27c" stroke-width="0.4"/>
    </pattern>
    <style>
