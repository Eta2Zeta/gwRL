<svg xmlns="http://www.w3.org/2000/svg" width="960" height="678" viewBox="0 0 960 678" role="img" aria-labelledby="title desc">
  <title id="title">Each zone has its own 42,532 input neurons; each feature has one embedding, used by every zone</title>
  <desc id="desc">Decision 612's zone features as a matrix: one row per zone, each row that zone's input layer of 42,532 input neurons, one per zone feature, holding the zone's feature value after feature scaling; one column per zone feature. Shown are 8 columns, 0 possessor:ccp, 3 possessor:kmt, 186 units:ccp:militia, 188 units:ccp:mountain_infantry, 312 units:kmt:infantry, 321 units:kmt:militia, 27,571 project:kmt:fortification, 29,244 rail_to:land_china_hopeh, and 5 of the 37 rows. Shensi: 0.69 for possessor:ccp, 0.69 for units:ccp:militia, 0.69 for units:ccp:mountain_infantry, 0.69 for rail_to:land_china_hopeh; Hopeh: 0.69 for possessor:kmt, 0.69 for project:kmt:fortification; Suiyuan: 0.69 for possessor:kmt, 1.39 for units:kmt:militia; Szechwan: 0.69 for possessor:kmt; Tsinghai: 0.69 for possessor:kmt, 1.10 for units:kmt:infantry, 0.69 for units:kmt:militia; every other entry shown is 0. To the right, each zone's row gives its own 64 outputs. Below the matrix, the zone embedding table: one embedding of 64 learned numbers under each column, 42,532 in all, the same for every row. Column 3, possessor:kmt, is outlined: Hopeh, Suiyuan, Szechwan and Tsinghai each hold 0.69 in it, and each adds 0.69 times embedding 3 to its own outputs, one embedding used in four zones. Column 321, units:kmt:militia: Suiyuan adds 1.39 times embedding 321 for its 3 militia, Tsinghai 0.69 times embedding 321 for its 1. A zone's outputs add up, along its row, each input times the embedding under its column. The board has 37 rows of 42,532 input neurons, 37 × 42,532 = 1,573,684 in all, and the table has 42,532 embeddings, one per column, not one per zone.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <pattern id="outcells" width="3" height="12" patternUnits="userSpaceOnUse">
