<svg xmlns="http://www.w3.org/2000/svg" width="960" height="536" viewBox="0 0 960 536" role="img" aria-labelledby="title desc">
  <title id="title">Messages along the borders, around Shensi</title>
  <desc id="desc">Two panels of a schematic map around Shensi. Message layer 1: every zone hears from its neighbours at the same time: arrows run into Shensi from its four neighbours, Hopeh, Suiyuan, Szechwan and Tsinghai, and into those four from the 12 zones beyond them: Beiping, Shantung and sea zone P14 into Hopeh; Beiping, Rehe, Central Mongolia and Kerulen into Suiyuan; Hunan, Kweichow, Shantung and Sikang into Szechwan; Sikang, Sinkiang, Central Mongolia, Ulyassutai and Tibet into Tsinghai. After it, Shensi's vector reflects its 4 neighbours. Message layer 2: Shensi hears its neighbours again, and their vectors now carry what they heard from the zones beyond, so after it Shensi's vector also reflects those 12 zones. Every zone sends along all its borders at once, so 2 layers reach zones up to 2 borders away.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
