  <title id="title">Decision 612's legal moves as a grid of answers</title>
  <desc id="desc">A grid of real answers from decision 612's five legal moves, one line per move, with 10 of the 12,673 move columns: kind:movement_route, kind:end_phase, unit:0_source:ccp:mountain_infantry, unit_stat:0_source:move_1, zone:1_path for Shensi, Hopeh, Suiyuan, Szechwan and Tsinghai, and true:combat. Each of the four attacks answers 1 to kind:movement_route, unit:0_source:ccp:mountain_infantry, unit_stat:0_source:move_1, zone:1_path:land_china_shensi, the path column of its own destination and true:combat, and has 19 non-zero answers in all; ending the phase answers 1 to kind:end_phase and has 4. On the right, the links: each attack starts from Shensi and acts on its destination; ending the phase links to no zone. In all 80 non-zero answers.</desc>
