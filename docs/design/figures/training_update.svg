<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Where a training step's 32 samples come from</title>
  <desc id="desc">Four parts. One: a batch of 32 self-play games plays at once, 8 game processes of 4 games each, with the networks frozen; at each decision a random draw keeps it as a sample with chance 5%, and when a game ends its final scores are added to its samples. On 5 November one batch kept 1,611 samples from 33,062 decisions. Two: when every game of the batch has ended, its samples join the replay buffer in the main training process: the latest 8,000 samples, about five batches, drawn as five bars from the oldest batch, whose samples leave first, to the newest, whose samples just joined. Purple dots scattered over all five bars mark one training step's 32 samples, drawn at random. Three: one training step, 700 in each update, each with a new draw: draw 32 different samples at random from the whole buffer; each of the three networks reads all 32 in one call; each compares its values with the final scores on all 32 samples and its move probabilities with the search's shares on its own alliance's samples; each takes one Adam step. Four: after the 700th step the networks are saved and the next batch of games plays with them. With 64 by 2 networks on the CPU, a batch's 32 games take about 15 minutes to play and its 700 steps under a minute; no game plays during the steps.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <pattern id="samples" width="4" height="18" patternUnits="userSpaceOnUse">
      <rect width="4" height="18" fill="#ffffff"/>
      <rect x="1.5" width="1" height="18" fill="#aceebb"/>
    </pattern>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 15px; font-weight: 600; }
      .sub { font-size: 12px; fill: #57606a; font-style: italic; }
      .body { font-size: 13px; }
      .bold { font-weight: 600; }
      .label { font-size: 12px; fill: #57606a; }
      .step { font-size: 13px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="419" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- 1. A batch of games -->
  <rect x="24" y="24" width="226" height="294" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
  <circle cx="48" cy="50" r="13" fill="#0969da"/>
  <text class="step" x="48" y="54.5" text-anchor="middle">1</text>
  <text class="title" x="70" y="55">A batch of games</text>
  <text class="sub" x="40" y="80">networks frozen</text>
  <text class="body" x="40" y="108">32 games at once: 8 game</text>
  <text class="body" x="40" y="126">processes of 4 games each.</text>
  <text class="body" x="40" y="152">At each decision, a random</text>
  <text class="body" x="40" y="170">draw keeps it as a sample</text>
  <text class="body" x="40" y="188">with chance 5%. When a game</text>
  <text class="body" x="40" y="206">ends, its final scores are</text>
  <text class="body" x="40" y="224">added to its samples.</text>
  <text class="label" x="40" y="252">5 November: 1,611 samples</text>
  <text class="label" x="40" y="268">kept from 33,062 decisions</text>

  <!-- 2. The replay buffer -->
  <rect x="306" y="24" width="294" height="294" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
  <circle cx="330" cy="50" r="13" fill="#1a7f37"/>
  <text class="step" x="330" y="54.5" text-anchor="middle">2</text>
  <text class="title" x="352" y="55">The replay buffer</text>
  <text class="sub" x="322" y="80">in the main training process</text>
  <text class="body" x="322" y="108">The latest 8,000 samples, about five</text>
  <text class="body" x="322" y="126">batches. Purple dots: one step's 32</text>
  <text class="body" x="322" y="144">samples, drawn at random from all.</text>
  <text class="label" x="322" y="166">oldest batch: its samples leave first</text>
  <rect x="322" y="174" width="262" height="18" rx="3" fill="url(#samples)" stroke="#4ac26b"/>
  <rect x="322" y="198" width="262" height="18" rx="3" fill="url(#samples)" stroke="#4ac26b"/>
  <rect x="322" y="222" width="262" height="18" rx="3" fill="url(#samples)" stroke="#4ac26b"/>
  <rect x="322" y="246" width="262" height="18" rx="3" fill="url(#samples)" stroke="#4ac26b"/>
  <rect x="322" y="270" width="262" height="18" rx="3" fill="url(#samples)" stroke="#4ac26b"/>
  <circle cx="527.5" cy="207.0" r="3.4" fill="#8250df"/>
  <circle cx="575.0" cy="207.0" r="3.4" fill="#8250df"/>
  <circle cx="353.4" cy="279.0" r="3.4" fill="#8250df"/>
  <circle cx="486.0" cy="279.0" r="3.4" fill="#8250df"/>
  <circle cx="544.3" cy="255.0" r="3.4" fill="#8250df"/>
  <circle cx="562.8" cy="207.0" r="3.4" fill="#8250df"/>
  <circle cx="478.9" cy="255.0" r="3.4" fill="#8250df"/>
  <circle cx="374.7" cy="231.0" r="3.4" fill="#8250df"/>
  <circle cx="405.2" cy="183.0" r="3.4" fill="#8250df"/>
  <circle cx="545.0" cy="231.0" r="3.4" fill="#8250df"/>
  <circle cx="532.5" cy="255.0" r="3.4" fill="#8250df"/>
  <circle cx="468.9" cy="255.0" r="3.4" fill="#8250df"/>
  <circle cx="448.0" cy="207.0" r="3.4" fill="#8250df"/>
  <circle cx="422.7" cy="279.0" r="3.4" fill="#8250df"/>
  <circle cx="395.6" cy="255.0" r="3.4" fill="#8250df"/>
  <circle cx="340.6" cy="255.0" r="3.4" fill="#8250df"/>
  <circle cx="511.3" cy="279.0" r="3.4" fill="#8250df"/>
  <circle cx="445.4" cy="279.0" r="3.4" fill="#8250df"/>
  <circle cx="446.3" cy="183.0" r="3.4" fill="#8250df"/>
  <circle cx="356.0" cy="207.0" r="3.4" fill="#8250df"/>
  <circle cx="336.4" cy="207.0" r="3.4" fill="#8250df"/>
  <circle cx="455.3" cy="279.0" r="3.4" fill="#8250df"/>
  <circle cx="507.4" cy="183.0" r="3.4" fill="#8250df"/>
  <circle cx="457.4" cy="231.0" r="3.4" fill="#8250df"/>
  <circle cx="410.3" cy="231.0" r="3.4" fill="#8250df"/>
  <circle cx="428.4" cy="231.0" r="3.4" fill="#8250df"/>
  <circle cx="486.9" cy="183.0" r="3.4" fill="#8250df"/>
  <circle cx="347.0" cy="207.0" r="3.4" fill="#8250df"/>
  <circle cx="364.7" cy="207.0" r="3.4" fill="#8250df"/>
  <circle cx="392.4" cy="279.0" r="3.4" fill="#8250df"/>
  <circle cx="360.5" cy="231.0" r="3.4" fill="#8250df"/>
  <circle cx="340.5" cy="231.0" r="3.4" fill="#8250df"/>
  <text class="label" x="322" y="306">newest batch: its samples just joined</text>

  <!-- 3. One training step -->
  <rect x="656" y="24" width="280" height="294" rx="10" fill="#fbefff" stroke="#c297ff"/>
  <circle cx="680" cy="50" r="13" fill="#8250df"/>
  <text class="step" x="680" y="54.5" text-anchor="middle">3</text>
  <text class="title" x="702" y="55">One training step</text>
  <text class="sub" x="672" y="80">700 per update, each with a new draw</text>
  <text class="body" x="672" y="108"><tspan class="bold">Draw:</tspan> 32 different samples at</text>
  <text class="body" x="672" y="126">random from the whole buffer.</text>
  <text class="body" x="672" y="152"><tspan class="bold">Read:</tspan> each of the three networks</text>
  <text class="body" x="672" y="170">reads all 32 in one call.</text>
  <text class="body" x="672" y="196"><tspan class="bold">Compare:</tspan> its values with the final</text>
  <text class="body" x="672" y="214">scores on all 32; its move</text>
  <text class="body" x="672" y="232">probabilities with the shares on</text>
  <text class="body" x="672" y="250">its own alliance's samples.</text>
  <text class="body" x="672" y="276"><tspan class="bold">Step:</tspan> each network takes one</text>
  <text class="body" x="672" y="294">Adam step.</text>

  <!-- Arrows: games to the newest batch, the draw to the step -->
  <line x1="250" y1="279" x2="318" y2="279" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="588" y1="231" x2="652" y2="231" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="body bold" x="628" y="222" text-anchor="middle">32</text>

  <!-- Return: save, then the next batch -->
  <path d="M 796 318 L 796 340 Q 796 356 780 356 L 153 356 Q 137 356 137 340 L 137 322" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="216" y="340" width="528" height="32" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="235" cy="356" r="12" fill="#57606a"/>
  <text class="step" x="235" y="360.5" text-anchor="middle">4</text>
  <text class="body bold" x="255" y="360.5">After the 700th step: save the networks for the next batch</text>
  <text class="label" x="480" y="402" text-anchor="middle">With 64×2 networks on the CPU, a batch's 32 games take about 15 minutes to play, and its 700 steps under a minute. No game plays during the steps.</text>
</svg>
