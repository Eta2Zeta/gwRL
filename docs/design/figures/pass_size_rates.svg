<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Positions the network evaluates per second, by the positions in a pass, on the GPU and on one CPU core</title>
  <desc id="desc">Three line charts side by side, for networks of 64×2, 256×8 and 512×16, on logarithmic scales, from the 14 November measurements through the coordinator's own code. Each shows positions evaluated per second against positions in a pass of 1, 4, 16, 64 and 256. On the GPU the rate rises with the pass: at 64×2 485, 1,085, 3,422, 9,835, 20,916; at 256×8 216, 637, 1,940, 4,503, 6,552; at 512×16 178, 405, 920, 1,641, 1,903. On one CPU core it rises at most 40% beyond 16 positions: at 64×2 2,198, 4,154, 5,850, 6,243, 6,082; at 256×8 360, 505, 577, 600, 658; at 512×16 87, 117, 125, 175, 166. One core is faster in small passes up to 256×8; the GPU is faster in large ones, and at 512×16 in every pass. A shaded band from 8 to 24 positions marks today's layout: rounds of about 8 positions, and never more than its 24 games in flight.</desc>
