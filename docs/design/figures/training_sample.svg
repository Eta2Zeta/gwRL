  <text class="note" x="368" y="390" text-anchor="start">The move played was drawn at random in proportion to the shares.</text>
  <text class="note" x="368" y="406" text-anchor="start">Training moves the network&#x27;s probabilities toward the shares.</text>
  <rect x="24" y="80" width="300" height="264" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="48" cy="106" r="11" fill="#57606a"/>
  <text class="step" x="48" y="110.5" text-anchor="middle">1</text>
  <text class="title" x="68" y="111" text-anchor="start">What the network read</text>
  <text class="sub" x="68" y="130" text-anchor="start">stored: the decision&#x27;s input</text>
  <text class="body" x="44" y="160" text-anchor="start">840 answers about the board (37 zones)</text>
  <text class="body" x="44" y="179" text-anchor="start">191 about the position as a whole</text>
  <text class="body" x="44" y="198" text-anchor="start">80 about the five legal moves</text>
  <text class="body" x="44" y="217" text-anchor="start">and each move&#x27;s zones: 12 KB in all</text>
