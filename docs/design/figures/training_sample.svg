  <text class="num" x="920" y="321" text-anchor="end">0.53</text>
  <rect x="368" y="359" width="12" height="10" rx="2" fill="#0969da"/>
  <text class="legend" x="385" y="368" text-anchor="start">the search's share (stored)</text>
  <rect x="564" y="361" width="12" height="6" rx="2" fill="#bc4c00"/>
