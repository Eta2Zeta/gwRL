  <text class="title" x="392" y="111" text-anchor="start">How the search split its 64 simulations</text>
  <text class="sub" x="392" y="130" text-anchor="start">stored: each move&#x27;s share, the policy target</text>
  <text class="head" x="808" y="152" text-anchor="end">visits</text>
  <text class="head" x="864" y="152" text-anchor="end">share</text>
  <text class="head" x="920" y="152" text-anchor="end">network</text>
  <line x1="610.00" y1="162" x2="610.00" y2="338" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="610.00" y="353" text-anchor="middle">0</text>
  <line x1="666.67" y1="162" x2="666.67" y2="338" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="666.67" y="353" text-anchor="middle">0.2</text>
  <line x1="723.33" y1="162" x2="723.33" y2="338" stroke="#eaeef2" stroke-width="1"/>
