<svg xmlns="http://www.w3.org/2000/svg" width="960" height="578" viewBox="0 0 960 578" role="img" aria-labelledby="title desc">
  <title id="title">One real training sample</title>
  <desc id="desc">One sample, from round 5 of a self-play game: the Comintern chooses the CCP&#x27;s Combat Movement. Part 1, what the network read, stored as the decision&#x27;s input: 840 answers about the board, from all 37 zones; 191 about the position as a whole; 80 about the five legal moves; and the zones each move names; 12 KB in all. In Shensi, one of its 9 answers is units:ccp:mountain_infantry = 1; in Hopeh, two of its 28 answers are possessor:kmt = 1 and project:kmt:major_shipyard = 1. Part 2, who chose: the Comintern, for the CCP; in parts 3 and 4, the network is the Comintern&#x27;s. Part 3, how the search split its 64 simulations, stored as each move&#x27;s share, the policy target. The CCP mountain infantry in Shensi attacking Hopeh: 36 visits, share 0.56, the network&#x27;s own probability 0.10; this move was played. Attacking Suiyuan: 2 visits, share 0.03, network 0.10. Attacking Szechwan: 5 visits, share 0.08, network 0.09. Attacking Tsinghai: 9 visits, share 0.14, network 0.18. Ending Combat Movement: 12 visits, share 0.19, network 0.53. The move played was drawn at random in proportion to the shares; training moves the network&#x27;s probabilities toward them. Part 4, how the game ended, stored when it ends as the value target: Axis +49.0, the network predicted +25.1; Allies −63.8, the network predicted −42.4; Comintern −106.2, the network predicted −102.4.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .heading { font-size: 16px; font-weight: 600; }
    .subheading { font-size: 12.5px; fill: #57606a; }
    .title { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: #57606a; font-style: italic; }
    .body { font-size: 13px; }
    .move { font-size: 12.5px; }
    .played { font-size: 11px; fill: #57606a; }
    .head { font-size: 11.5px; fill: #57606a; font-weight: 600; }
    .legend { font-size: 11.5px; fill: #57606a; }
    .num { font-size: 12.5px; font-variant-numeric: tabular-nums; }
    .score { font-size: 18px; font-weight: 600; }
    .tick { font-size: 11px; fill: #57606a; font-variant-numeric: tabular-nums; }
    .note { font-size: 11.5px; fill: #57606a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #1f2328; }
    .step { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect x="0.5" y="0.5" width="959" height="577" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text class="heading" x="24" y="36">One real sample</text>
  <text class="subheading" x="24" y="58">Round 5, the CCP&#x27;s Combat Movement, in a game the networks played after one training batch (5 November 2026)</text>
