<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-labelledby="title desc">
  <title id="title">How the search tree grows: four simulations</title>
  <desc id="desc">The current position R has three moves, A, B and C, with network priors 0.5, 0.3 and 0.2. Simulations 1, 2 and 3 each try one untried move and add the positions RA, RB and RC at depth 1, asking the network about each. Simulation 4 scores the three moves again, A 1.75, B 0.45 and C 0.8, plays A, then at RA plays x, the move with the highest prior, and adds RAx at depth 2.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bc4c00"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .node { font-size: 15px; font-weight: 700; }
      .edge { font-size: 13px; fill: #57606a; }
      .hot { font-size: 13px; fill: #bc4c00; font-weight: 600; }
      .depth { font-size: 12px; fill: #8c959f; }
      .badge { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .head { font-size: 14px; font-weight: 600; }
      .body { font-size: 13px; }
      .note { font-size: 12px; fill: #57606a; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="369" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Depth guides -->
  <line x1="24" y1="70" x2="560" y2="70" stroke="#eaeef2" stroke-dasharray="4 4"/>
  <line x1="24" y1="190" x2="560" y2="190" stroke="#eaeef2" stroke-dasharray="4 4"/>
  <line x1="24" y1="310" x2="560" y2="310" stroke="#eaeef2" stroke-dasharray="4 4"/>
  <text class="depth" x="24" y="62">depth 0</text>
  <text class="depth" x="24" y="182">depth 1</text>
  <text class="depth" x="24" y="302">depth 2</text>

  <!-- Edges -->
  <line x1="320" y1="91" x2="200" y2="167" stroke="#bc4c00" stroke-width="3" marker-end="url(#arrow-hot)"/>
  <line x1="340" y1="96" x2="340" y2="162" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="91" x2="480" y2="167" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="216" x2="180" y2="282" stroke="#bc4c00" stroke-width="3" marker-end="url(#arrow-hot)"/>
  <text class="hot" x="196" y="118">A · prior 0.5</text>
  <text class="edge" x="348" y="134">B · prior 0.3</text>
  <text class="edge" x="430" y="118">C · prior 0.2</text>
  <text class="hot" x="190" y="254">x · highest prior</text>

  <!-- Nodes -->
  <circle cx="340" cy="70" r="26" fill="#0969da"/>
  <text class="node" x="340" y="75" text-anchor="middle" fill="#ffffff" style="fill:#ffffff">R</text>
  <circle cx="180" cy="190" r="26" fill="#fff1e5" stroke="#bc4c00" stroke-width="2.5"/>
  <text class="node" x="180" y="195" text-anchor="middle">RA</text>
  <circle cx="340" cy="190" r="26" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
  <text class="node" x="340" y="195" text-anchor="middle">RB</text>
  <circle cx="500" cy="190" r="26" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
  <text class="node" x="500" y="195" text-anchor="middle">RC</text>
  <circle cx="180" cy="310" r="26" fill="#fff1e5" stroke="#bc4c00" stroke-width="2.5"/>
  <text class="node" x="180" y="315" text-anchor="middle">RAx</text>

  <!-- Which simulation added each position -->
  <circle cx="154" cy="168" r="11" fill="#57606a"/><text class="badge" x="154" y="172.5" text-anchor="middle">1</text>
  <circle cx="366" cy="168" r="11" fill="#57606a"/><text class="badge" x="366" y="172.5" text-anchor="middle">2</text>
  <circle cx="526" cy="168" r="11" fill="#57606a"/><text class="badge" x="526" y="172.5" text-anchor="middle">3</text>
  <circle cx="206" cy="288" r="11" fill="#bc4c00"/><text class="badge" x="206" y="292.5" text-anchor="middle">4</text>

  <!-- Legend -->
  <rect x="584" y="28" width="292" height="314" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="head" x="600" y="54">Each simulation walks down</text>
  <text class="head" x="600" y="72">from R and stops at the first</text>
  <text class="head" x="600" y="90">position nobody has evaluated:</text>
  <text class="head" x="600" y="108">it asks the network there.</text>
  <circle cx="610" cy="140" r="11" fill="#57606a"/><text class="badge" x="610" y="144.5" text-anchor="middle">1</text>
  <text class="body" x="630" y="145">plays A: RA is new, depth 1</text>
  <circle cx="610" cy="168" r="11" fill="#57606a"/><text class="badge" x="610" y="172.5" text-anchor="middle">2</text>
  <text class="body" x="630" y="173">plays B: RB is new, depth 1</text>
  <circle cx="610" cy="196" r="11" fill="#57606a"/><text class="badge" x="610" y="200.5" text-anchor="middle">3</text>
  <text class="body" x="630" y="201">plays C: RC is new, depth 1</text>
  <circle cx="610" cy="224" r="11" fill="#bc4c00"/><text class="badge" x="610" y="228.5" text-anchor="middle">4</text>
  <text class="body" x="630" y="229">scores A 1.75, B 0.45, C 0.8,</text>
  <text class="body" x="630" y="247">so plays A; at RA nothing is</text>
  <text class="body" x="630" y="265">tried yet, so x, the highest</text>
  <text class="body" x="630" y="283">prior: RAx is new, depth 2</text>
  <text class="note" x="600" y="316">Orange: simulation 4's path.</text>
</svg>
