<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">How long the games became</title>
  <desc id="desc">A line chart of the median number of decisions in each network update's 25 self-play games, for network updates 1 to 19: 333 at first, then rising to about 2,100. A dashed line marks the 880 decisions of the land-weighted run's trained network, which the time estimates assumed.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 15px; font-weight: 600; }
      .sub { font-size: 12px; fill: #57606a; font-style: italic; }
      .label { font-size: 12px; fill: #57606a; }
      .tick { font-size: 12px; fill: #57606a; font-variant-numeric: tabular-nums; }
      .end { font-size: 12px; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="419" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text class="title" x="24" y="36">How long the games became</text>
  <text class="sub" x="24" y="58">Median decisions in each network update's 25 games; the land-weighted run's trained network played about 880</text>
  <line x1="24" y1="82" x2="46" y2="82" stroke="#2a78d6" stroke-width="2"/>
  <text class="label" x="54" y="86">median decisions a game</text>
  <line x1="76" y1="350.0" x2="760" y2="350.0" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="68" y="354.0" text-anchor="end">0</text>
  <line x1="76" y1="302.0" x2="760" y2="302.0" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="68" y="306.0" text-anchor="end">500</text>
  <line x1="76" y1="254.0" x2="760" y2="254.0" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="68" y="258.0" text-anchor="end">1000</text>
  <line x1="76" y1="206.0" x2="760" y2="206.0" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="68" y="210.0" text-anchor="end">1500</text>
  <line x1="76" y1="158.0" x2="760" y2="158.0" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="68" y="162.0" text-anchor="end">2000</text>
  <line x1="76" y1="110.0" x2="760" y2="110.0" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="68" y="114.0" text-anchor="end">2500</text>
  <text class="tick" x="76.0" y="368" text-anchor="middle">1</text>
  <text class="tick" x="228.0" y="368" text-anchor="middle">5</text>
  <text class="tick" x="418.0" y="368" text-anchor="middle">10</text>
  <text class="tick" x="608.0" y="368" text-anchor="middle">15</text>
  <text class="tick" x="760.0" y="368" text-anchor="middle">19</text>
  <line x1="76" y1="350" x2="760" y2="350" stroke="#d0d7de" stroke-width="1"/>
  <text class="label" x="418" y="390" text-anchor="middle">network update</text>
  <text class="label" x="76" y="100">decisions a game</text>
  <line x1="76" y1="265.5" x2="760" y2="265.5" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="end" x="768" y="269.5" fill="#cf222e">880 assumed</text>
