  <circle cx="76.0" cy="318.0" r="3.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="114.0" cy="269.0" r="3.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/>
