  <circle cx="646.0" cy="122.0" r="3.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="684.0" cy="143.9" r="3.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="722.0" cy="181.2" r="3.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="760.0" cy="150.3" r="3.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/>
  <text class="end" x="768" y="154.3" fill="#2a78d6">2080</text>
</svg>
