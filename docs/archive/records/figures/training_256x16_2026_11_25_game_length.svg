  <circle cx="380.0" cy="162.9" r="3.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="418.0" cy="173.2" r="3.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="456.0" cy="168.3" r="3.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="494.0" cy="146.2" r="3.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="532.0" cy="145.0" r="3.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="570.0" cy="144.2" r="3.5" fill="#2a78d6" stroke="#ffffff" stroke-width="1.5"/>
