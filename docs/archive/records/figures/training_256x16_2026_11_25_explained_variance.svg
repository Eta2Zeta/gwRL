  <circle cx="570.0" cy="175.3" r="3.5" fill="#8250df" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="608.0" cy="150.8" r="3.5" fill="#8250df" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="646.0" cy="200.2" r="3.5" fill="#8250df" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="684.0" cy="192.6" r="3.5" fill="#8250df" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="722.0" cy="249.2" r="3.5" fill="#8250df" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="760.0" cy="294.5" r="3.5" fill="#8250df" stroke="#ffffff" stroke-width="1.5"/>
  <text class="end" x="768" y="298.5" fill="#8250df">-0.5</text>
