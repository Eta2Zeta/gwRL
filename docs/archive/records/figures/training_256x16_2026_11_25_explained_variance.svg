  <circle cx="342.0" cy="221.3" r="3.5" fill="#8250df" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="380.0" cy="320.7" r="3.5" fill="#8250df" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="418.0" cy="235.1" r="3.5" fill="#8250df" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="456.0" cy="175.7" r="3.5" fill="#8250df" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="494.0" cy="159.4" r="3.5" fill="#8250df" stroke="#ffffff" stroke-width="1.5"/>
