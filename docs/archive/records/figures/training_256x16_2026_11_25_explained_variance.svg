<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">How much of the difference between games the values explained</title>
  <desc id="desc">A line chart of the explained variance of the values on each network update's 25 new games, for network updates 2 to 19: one minus the value loss over the variance of the games' final scores. It is negative or near zero until the 10th, positive from the 11th to the 17th and negative again in the 18th and 19th.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 15px; font-weight: 600; }
      .sub { font-size: 12px; fill: #57606a; font-style: italic; }
      .label { font-size: 12px; fill: #57606a; }
      .tick { font-size: 12px; fill: #57606a; font-variant-numeric: tabular-nums; }
      .end { font-size: 12px; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="419" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text class="title" x="24" y="36">How much of the difference between games the values explained</text>
  <text class="sub" x="24" y="58">Explained variance on each network update's 25 new games: 0 is as good as always guessing their mean score</text>
  <line x1="24" y1="82" x2="46" y2="82" stroke="#8250df" stroke-width="2"/>
  <text class="label" x="54" y="86">explained variance</text>
  <line x1="76" y1="350.0" x2="760" y2="350.0" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="68" y="354.0" text-anchor="end">-0.8</text>
  <line x1="76" y1="315.7" x2="760" y2="315.7" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="68" y="319.7" text-anchor="end">-0.6</text>
  <line x1="76" y1="281.4" x2="760" y2="281.4" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="68" y="285.4" text-anchor="end">-0.4</text>
  <line x1="76" y1="247.1" x2="760" y2="247.1" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="68" y="251.1" text-anchor="end">-0.2</text>
  <line x1="76" y1="212.9" x2="760" y2="212.9" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="68" y="216.9" text-anchor="end">+0.0</text>
  <line x1="76" y1="178.6" x2="760" y2="178.6" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="68" y="182.6" text-anchor="end">+0.2</text>
  <line x1="76" y1="144.3" x2="760" y2="144.3" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="68" y="148.3" text-anchor="end">+0.4</text>
  <line x1="76" y1="110.0" x2="760" y2="110.0" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="68" y="114.0" text-anchor="end">+0.6</text>
  <text class="tick" x="76.0" y="368" text-anchor="middle">1</text>
  <text class="tick" x="228.0" y="368" text-anchor="middle">5</text>
  <text class="tick" x="418.0" y="368" text-anchor="middle">10</text>
  <text class="tick" x="608.0" y="368" text-anchor="middle">15</text>
  <text class="tick" x="760.0" y="368" text-anchor="middle">19</text>
  <line x1="76" y1="350" x2="760" y2="350" stroke="#d0d7de" stroke-width="1"/>
  <text class="label" x="418" y="390" text-anchor="middle">network update</text>
  <text class="label" x="76" y="100">share of the variance</text>
  <line x1="76" y1="212.9" x2="760" y2="212.9" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="end" x="768" y="216.9" fill="#cf222e">the mean</text>
  <polyline points="114.0,232.1 152.0,219.4 190.0,261.7 228.0,230.9 266.0,237.7 304.0,258.1 342.0,221.3 380.0,320.7 418.0,235.1 456.0,175.7 494.0,159.4 532.0,195.4 570.0,175.3 608.0,150.8 646.0,200.2 684.0,192.6 722.0,249.2 760.0,294.5" fill="none" stroke="#8250df" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
