<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Memory the run used</title>
  <desc id="desc">A line chart of the training run's memory, the physical footprints of its processes sampled once a minute, over the hours since 07:40 on 25 November, with dashed lines at the supervisor's stop lines, 15 GB under the 16 GB allowance until 11:26 and 19 GB under the 20 GB allowance since, and dotted lines at its six stops. It held about 8 to 11 GB in the morning, outside the restarts, and 10 to 14 GB in the afternoon; the supervisor's one-second samples found the peaks above the stop lines that the one-minute samples missed.</desc>
