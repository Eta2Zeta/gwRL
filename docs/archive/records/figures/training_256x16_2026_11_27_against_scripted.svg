<svg xmlns="http://www.w3.org/2000/svg" width="960" height="524" viewBox="0 0 960 524" role="img" aria-labelledby="title desc">
  <title id="title">How each network scored against the scripted policy, seat by seat</title>
  <desc id="desc">A dot chart of each network's mean final score minus the scripted balanced policy's, in the same seat on the same 24 held-out seeds, with bars of one standard error either side, for the Axis, the Allies and the Comintern. The untrained 256×16 network scores +16.8, −66.9 and −3.6; the 256×16 network after 55 network updates +28.2, −32.9 and +8.9; the 256×16 network after 138 network updates +27.4, −66.1 and +2.2; and the 256×8 network of the training run under the land-weighted score after 595 network updates +21.0, −72.0 and +1.3.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 15px; font-weight: 600; }
      .sub { font-size: 12px; fill: #57606a; font-style: italic; }
      .group { font-size: 13px; font-weight: 600; }
      .label { font-size: 12px; fill: #57606a; }
      .tick { font-size: 12px; fill: #57606a; font-variant-numeric: tabular-nums; }
      .value { font-size: 12px; fill: #1f2328; font-variant-numeric: tabular-nums; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="523" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text class="title" x="24" y="36">How each network scored against the scripted policy, seat by seat</text>
  <text class="sub" x="24" y="58">Mean difference from the scripted balanced policy in the same seat on the same 24 held-out seeds, the other two seats scripted; the bars span one standard error either side</text>
  <text class="sub" x="24" y="76">The 256×16 networks are this run's; the 256×8 network is that of the training run under the land-weighted score, 22 to 24 November 2026</text>
  <line x1="417.4" y1="100" x2="417.4" y2="460" stroke="#eaeef2" stroke-width="1"/>
