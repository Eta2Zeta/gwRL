  <text class="tick" x="492.2" y="478" text-anchor="middle">−60</text>
  <line x1="567.0" y1="100" x2="567.0" y2="460" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="567.0" y="478" text-anchor="middle">−40</text>
  <line x1="641.9" y1="100" x2="641.9" y2="460" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="641.9" y="478" text-anchor="middle">−20</text>
  <line x1="716.7" y1="100" x2="716.7" y2="460" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="716.7" y="478" text-anchor="middle">0</text>
