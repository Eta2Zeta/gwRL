  <line x1="866.3" y1="100" x2="866.3" y2="460" stroke="#eaeef2" stroke-width="1"/>
  <text class="tick" x="866.3" y="478" text-anchor="middle">+40</text>
  <line x1="716.7" y1="100" x2="716.7" y2="460" stroke="#57606a" stroke-width="1.5"/>
  <text class="label" x="632" y="502" text-anchor="middle">points of final score above the scripted balanced policy in the same seat, on the same 24 seeds</text>
