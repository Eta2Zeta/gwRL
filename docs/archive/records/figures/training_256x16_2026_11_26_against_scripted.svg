  <line x1="443.9" y1="234" x2="493.9" y2="234" stroke="#1baf7a" stroke-width="2"/>
  <line x1="443.9" y1="229" x2="443.9" y2="239" stroke="#1baf7a" stroke-width="2"/>
  <line x1="493.9" y1="229" x2="493.9" y2="239" stroke="#1baf7a" stroke-width="2"/>
  <circle cx="468.9" cy="234" r="5" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/>
  <text class="value" x="501.9" y="238">−66.9</text>
