  <text class="label" x="60" y="362">256×16 network after 55 network updates</text>
  <line x1="746.5" y1="358" x2="774.5" y2="358" stroke="#2a78d6" stroke-width="2"/>
  <line x1="746.5" y1="353" x2="746.5" y2="363" stroke="#2a78d6" stroke-width="2"/>
