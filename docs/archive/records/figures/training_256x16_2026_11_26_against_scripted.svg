  <line x1="423.5" y1="278" x2="475.1" y2="278" stroke="#eb6834" stroke-width="2"/>
  <line x1="423.5" y1="273" x2="423.5" y2="283" stroke="#eb6834" stroke-width="2"/>
  <line x1="475.1" y1="273" x2="475.1" y2="283" stroke="#eb6834" stroke-width="2"/>
  <circle cx="449.3" cy="278" r="5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
  <text class="value" x="483.1" y="282">−72.0</text>
  <text class="group" x="24" y="314">Comintern</text>
  <circle cx="46" cy="336" r="5" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/>
  <text class="label" x="60" y="340">untrained 256×16 network</text>
  <line x1="700.4" y1="336" x2="724.6" y2="336" stroke="#1baf7a" stroke-width="2"/>
  <line x1="700.4" y1="331" x2="700.4" y2="341" stroke="#1baf7a" stroke-width="2"/>
  <line x1="724.6" y1="331" x2="724.6" y2="341" stroke="#1baf7a" stroke-width="2"/>
  <circle cx="712.5" cy="336" r="5" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/>
  <text class="value" x="732.6" y="340">−3.6</text>
