  <line x1="786.6" y1="171" x2="786.6" y2="181" stroke="#eb6834" stroke-width="2"/>
  <line x1="827.0" y1="171" x2="827.0" y2="181" stroke="#eb6834" stroke-width="2"/>
  <circle cx="806.8" cy="176" r="5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
  <text class="value" x="835.0" y="180">+21.0</text>
  <text class="group" x="24" y="212">Allies</text>
