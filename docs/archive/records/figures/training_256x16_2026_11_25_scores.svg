<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Self-play final scores</title>
  <desc id="desc">A line chart of each alliance's mean final score over each network update's 25 self-play games, for network updates 1 to 19, with dashed lines at the scores the starting wealth gives: Axis +29.1, Allies -45.5, Comintern -57.5. The Axis stays between +9 and +29, below its start; the Allies between -46 and -27, above theirs; the Comintern between -89 and -74, far below its start.</desc>
