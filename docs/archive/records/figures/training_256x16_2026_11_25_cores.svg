<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">CPU cores the run used</title>
  <desc id="desc">A line chart of the training run's CPU cores, the median of the last ten one-minute windows, over the hours since its second part started at 07:40 on 25 November, with dashed lines at the allowance of 8 cores and the owner's limit of 9, and dotted lines at the supervisor's six stops. The median was about 7.5 in the morning, 8.0 to 8.7 in the afternoon and passed 9 after 16:40.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 15px; font-weight: 600; }
      .sub { font-size: 12px; fill: #57606a; font-style: italic; }
      .label { font-size: 12px; fill: #57606a; }
      .tick { font-size: 12px; fill: #57606a; font-variant-numeric: tabular-nums; }
      .end { font-size: 12px; }
    </style>
  </defs>
